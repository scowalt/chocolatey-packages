name: Update packages

on:
  schedule:
    - cron: '5 4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  prepare:
    name: Plan, rewrite, pack and install every package
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Plan every package and rewrite the ones behind
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run daily:plan
      - name: Pack, install and uninstall every package
        if: ${{ !cancelled() }}
        run: bun run daily:install
      - name: Keep the result for the publish job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: prepare-report
          path: prepare-report.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Push to Chocolatey and commit to master
    needs: prepare
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 30
    environment: chocolatey
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Fetch the prepare job's result
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: prepare-report
          path: ${{ runner.temp }}/prepare-report
      - name: Re-derive every package, push the ones prepare vouched for and commit them
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          PREPARE_REPORT: ${{ runner.temp }}/prepare-report/prepare-report.json
          PREPARE_RESULT: ${{ needs.prepare.result }}
        run: bun run daily:publish
      - name: Report the successful run to the alerts router
        if: ${{ success() && needs.prepare.result == 'success' }}
        env:
          ALERTS_TOKEN: ${{ secrets.ALERTS_TOKEN }}
        run: |
          curl --fail --silent --show-error --retry 3 -X POST \
            -H "Authorization: Bearer $ALERTS_TOKEN" \
            "https://alerts.scowalt.com/heartbeat/chocolatey-packages/daily-update?every=2d"
